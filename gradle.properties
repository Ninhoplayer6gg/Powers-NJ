# Memory for the Minecraft decompilation/remapping steps.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47.1,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependencies
# Palladium (ThreeTAG) - core superpower framework. Published on https://maven.threetag.net
palladium_version=4.5.4
palladiumcore_version=1.0.1
palladium_version_range=[4.5,)
# GeckoLib - animation engine used for suit/tendril models. Same version Palladium 4.5.4 builds against.
geckolib_version=4.4.4
geckolib_version_range=[4.4,)
mclib_version=20
junit_version=5.10.2

## Mod
mod_id=powersnj
mod_name=Powers NJ
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.powersnj
mod_authors=Powers NJ Team
mod_description=Superhero power sets built on Palladium: suits, Suit Forge, progression, skill trees and character engines (Thragg, Venom, Reverse-Flash).
